[package]
name = "fdf_cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Fast file duplicate finder CLI application"

[[bin]]
name = "fdf"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive", "cargo"] }
ctrlc = "3.5.2"
fdf = { path = "../fdf" }
libc = "0.2"
indicatif = "0.18.6"
regex.workspace = true
serde_json = "1.0.151"
termcolor = "1.4.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }
