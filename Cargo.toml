[workspace]
members = ["crates/fdf", "crates/fdf_cli"]
default-members = ["crates/fdf_cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
authors = ["Aarni Koskela <akx@iki.fi>"]
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.102"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
